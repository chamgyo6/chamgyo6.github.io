// 문제 만들기: 구간마다 [발판 볼륨 n개를 밟고 달리기 → 큰 볼륨으로 점프 → 올라서기]. 올라선 큰 볼륨이 다음 구간의 출발점. 마지막 구간은 TOP 홀드
function buildProblem(){for(const m of props)scene.remove(m);props.length=0;const g=G.grade,col=COLORS[(G.prob-1)%COLORS.length];G.col=col;const nSec=g<2?2:3;
  let d=Math.random()<.5?1:-1,plat={x:-d*1.3,y:MAT,z:.75};G.secs=[];const stepCols=[0xc9a26b,0x8b9099,0x33363c,0xb9b2a4];

    for(let i=1;i<=n;i++){const x=plat.x+d*.68*i,y=plat.y+.34*i,w=rand(.56,.7),h=rand(.4,.5),vol=makeVolume(x,y-.35*h,w,h,.5,pick(stepCols));props.push(vol,makeHold(x,y+.012,.3,col[0],.1,.02,.08));

    const lx=steps[n-1].pin.x,ly=steps[n-1].pin.y-.05,top=s===nSec-1,cx=lx+d*.85,lipY=ly+2.15;let big,next=null;
    if(!top){const w=1.3,h=.7,dd=.55,cy=lipY-.25*h,sy=cy+.3875*h;props.push(makeVolume(cx,cy,w,h,dd,col[0]),makeHold(cx,lipY+.02,dd-.02,0xf4f1ea,.26,.03,.05));
      big={cx,lipY,z:dd,hangZ:dd+.18,hl:v3(cx-.16,lipY+.02,dd+.05),hr:v3(cx+.16,lipY+.02,dd+.05),hc:v3(cx,lipY,dd)};next={x:cx,y:sy,z:dd*.45}}
    else{const j=makeHold(cx,lipY-.03,.1,col[0],.24,.11,.12);props.push(j);const c=document.createElement('canvas');c.width=128;c.height=48;const q=c.getContext('2d');q.fillStyle='#16130f';q.fillRect(0,0,128,48);q.fillStyle='#ffd23f';q.font='bold 34px sans-serif';q.textAlign='center';q.fillText('TOP',64,37);
      const sg=new T.Mesh(new T.PlaneGeometry(.5,.19),new T.MeshBasicMaterial({map:new T.CanvasTexture(c)}));sg.position.set(cx,lipY+.34,.02);scene.add(sg);props.push(sg);
      big={cx,lipY,z:.14,hangZ:.5,hl:v3(cx-.1,lipY+.04,.18),hr:v3(cx+.1,lipY+.04,.18),hc:v3(cx,lipY,.2)}}
    const mk=p=>({x:p.x,y:p.y,z:p.z,l:v3(p.x-.13,p.y+.05,p.z),r:v3(p.x+.13,p.y+.05,p.z)});G.secs.push({d,n,steps,big,top,plat:mk(plat)});if(next){plat=next;d=-d}}}
function startProblem(){endQte();if(G.v){scene.remove(G.v.R.g);G.v=null}buildProblem();G.cp=0;G.vDone=false;G.vSec=1+((Math.random()*(G.secs.length-1))|0);G.fall=null;G.swing=null;G.zoom=0;G.bal=0;G.balV=0;slowT=0;hud();beginSection(0,true);camT.copy(player.H)}

function readyPose(sec,tele){const P=player,pl=sec.plat,to=v3(pl.x,pl.y+.84,pl.z+.06),yaw=sec.d*1.0;P.frog=0;setPin(P,'lf',pl.l,20);setPin(P,'rf',pl.r,20);setOff(P,'lh',-.26,.3,.2,12);setOff(P,'rh',.26,.3,.2,12);

function qte(q){G.qte=q;q.p=0;const el=$('qte');el.hidden=false;el.querySelector('b').textContent=q.label||KNAME[q.key];el.querySelector('small').textContent=q.sub||'';

  const a=tmpA.copy(q.anchor());a.project(camera);const el=$('qte'),w=el.offsetWidth,h=el.offsetHeight;
  const x=clamp((a.x*.5+.5)*innerWidth,w/2+8,innerWidth-w/2-8),y=clamp((-a.y*.5+.5)*innerHeight-h*.72,h/2+70,innerHeight-h/2-(innerHeight>500?190:120));
  el.style.transform=`translate(${(x-w/2).toFixed(0)}px,${(y-h/2).toFixed(0)}px)`;el.classList.toggle('go',q.p>=q.zone[0]&&q.p<=q.zone[1]);

function runGauge(){const s=G.secs[G.si],st=s.steps[G.step];
  qte({key:st.key,dur:gDur(1,.5,.05),zone:[.6,.93],perf:[.78,.87],anchor:()=>st.pin,sub:G.step?'다음 볼륨!':'볼륨 밟고 달려!',ok:pf=>stepGo(st,pf),fail:why=>fall(why==='늦었다!'?'발이 늦었다':'너무 빨리 뛰었다')})}
function stepGo(st,pf){const P=player,s=G.secs[G.si],k=st.key==='L'?'lf':'rf',o=k==='lf'?'rf':'lf',sk=k==='lf'?-1:1,from=P.H.clone(),to=v3(st.pin.x+s.d*.1,st.pin.y+.72,.48),y0=P.yaw;
  setPin(P,k,st.pin,26);setOff(P,o,-sk*.1,-.5,-.36,14);setOff(P,k==='lf'?'rh':'lh',-sk*.22,.5,.34,14);setOff(P,k==='lf'?'lh':'rh',sk*.28,.14,-.26,14);let hit=false,nx=false;

  const last=s.steps[s.n-1].pin,pts=[s.top?v3(last.x+s.d*.6,last.y+1.5,.5):v3(s.big.cx,s.big.lipY+.9,.35)];for(let i=s.n-1;i>=0;i--)pts.push(v3(s.steps[i].pin.x,s.steps[i].pin.y+.74,.48));
  V.H.copy(pts[0]);V.yaw=-s.d;V.pitch=.15;pose(V,1);G.v={R:V,pts,p:0,mode:'run',t:0,d:s.d};G.vDone=true;sfx.warn();say('겹치기 빌런 접근!',`"${pick(VLINES)}"`)}
function kickGauge(){const v=G.v;qte({key:'K',dur:gDur(1.15,.65,.05),zone:[.6,.93],perf:[.82,.9],anchor:()=>v.R.head.position,sub:'초록=날라차기 · 노랑=머리 밟고 점프',ok:kickGo,
  fail:why=>{pop(why==='늦었다!'?'겹쳤어요~':'헛발질!','#ff3b30',40);sfx.miss();fall('겹치기 빌런한테 밀렸다',-v.d*1.8)}})}
function kickGo(pf){const P=player,v=G.v,V=v.R,s=G.secs[G.si],d=s.d,from=P.H.clone(),y0=P.yaw,kk=d>0?'rf':'lf',ok=kk==='rf'?'lf':'rf',sg=kk==='rf'?1:-1,pl=s.plat;let hit=false,nx=false;sfx.whoosh();
  if(pf){const hp=V.head.position.clone(),to=hp.clone().add(v3(0,.86,0));setOff(P,ok,-sg*.1,-.45,-.3,12);
    act(.42,t=>{P.H.lerpVectors(from,to,eo(t));P.H.y+=Math.sin(Math.PI*t)*.2;P.pitch=.2;
      if(t>.3&&!hit){hit=true;setPin(P,kk,hp.clone().add(v3(0,.12,0)),30);stopT=.1;G.shake=.4;sfx.kick();buzz([30,20,50]);chalk(hp,12);pop('머리 밟고 점프!!','#ffd23f',36);addScore(600);v.mode='hit';v.t=0;v.vel=v3(-d*.4,-2.8,1.6)}
      if(t>.62&&!nx){nx=true;G.step=s.n;catchGauge()}})}
  else{const mid=from.clone().add(v3(d*.42,.3,.05));setOff(P,kk,sg*.05,-.1,.82,30);setOff(P,ok,-sg*.12,-.6,-.2,14);setOff(P,'lh',-.4,.35,-.2,14);setOff(P,'rh',.4,.35,-.2,14);
    act(.6,t=>{const a=t<.35?eo(t/.35):1-eio((t-.35)/.65);P.H.lerpVectors(from,mid,a);P.pitch=-.25*a;P.yaw=y0+(t>.3?d*Math.PI*2*eio((t-.3)/.7):0);
      if(t>.26&&!hit){hit=true;stopT=.11;slowT=.35;G.shake=.45;sfx.kick();buzz([30,20,50]);chalk(V.H,12);pop('날라차기 참교육!','#ff8a3d',36);addScore(300);v.mode='hit';v.t=0;v.vel=v3(d*4.4,3.4,1.8)}
      if(t>.5&&!nx){nx=true;setOff(P,kk,sg*.1,-.5,.1,16)}
      if(t>.85){setPin(P,'lf',pl.l,18);setPin(P,'rf',pl.r,18);setOff(P,'lh',-.26,.3,.2,12);setOff(P,'rh',.26,.3,.2,12)}},
     ()=>{P.yaw=y0;P.pitch=.12;later(.15,runGauge)})}}
function updVillain(dt,rdt){const v=G.v;if(!v)return;const R=v.R;
  if(v.mode==='run'){const segs=v.pts.length-1;v.p=Math.min(1,v.p+dt/(.36*segs));const x=v.p*segs,i=Math.min(segs-1,Math.floor(x)),fr=x-i;R.H.lerpVectors(v.pts[i],v.pts[i+1],fr);R.H.y+=Math.sin(Math.PI*fr)*.2;
    const ph=Math.sin(x*Math.PI);setOff(R,'lf',-.1,-.6+.2*Math.max(0,ph),.32*ph,18);setOff(R,'rf',.1,-.6+.2*Math.max(0,-ph),-.32*ph,18);setOff(R,'lh',-.26,.3,-.25*ph,18);setOff(R,'rh',.26,.3,.25*ph,18);
    if(v.p>=1){v.mode='lunge';kickGauge()}}
  else if(v.mode==='lunge'){tmpA.copy(player.H).sub(R.H);tmpA.y+=.1;const L=tmpA.length();if(L>.45)R.H.addScaledVector(tmpA.multiplyScalar(1/L),dt*2.2);R.pitch=.35;setOff(R,'lh',-.2,.5,.42,14);setOff(R,'rh',.2,.5,.42,14);setOff(R,'lf',-.1,-.6,-.3,14);setOff(R,'rf',.1,-.5,.2,14)}
  else if(v.mode==='hit'){v.vel.y-=16*dt;R.H.addScaledVector(v.vel,dt);R.pitch+=dt*9;R.lean+=dt*5;
    if(R.H.y<MAT+.22){R.H.y=MAT+.22;v.mode='down';v.t=0;R.pitch=Math.PI/2;R.lean=0;sfx.thud();G.shake=Math.max(G.shake||0,.2);chalk(R.H,10);pop(pick(['매트에 철퍼덕!','겹치기 반성 중...','으아악 내 루트!!']),'#fff',62)}}
  else{v.t+=rdt;if(v.t>1.6){chalk(R.H,8);scene.remove(R.g);G.v=null;return}}
  pose(R,dt)}
function lit(k){for(const b of ['L','R','G'])$('b'+b).classList.toggle('lit',b===k);$('kick').hidden=k!=='K'}
function showBal(on){$('bal').hidden=!on;$('balLbl').hidden=!on}
// ---------- 입력 ----------
function press(k){if(!G||G.over||G.fall)return;initAudio();qtePress(k)}
for(const b of document.querySelectorAll('#btns button')){const k=b.dataset.k;
  b.addEventListener('pointerdown',e=>{e.preventDefault();input.down[k]=true;b.classList.add('tapfx');press(k)});
  const up=()=>{input.down[k]=false;b.classList.remove('tapfx')};b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('pointerleave',up)}
$('kick').addEventListener('pointerdown',e=>{e.preventDefault();press('K')});
{const j=$('joy'),kn=$('knob');let id=null;const mv=e=>{const r=j.getBoundingClientRect();const x=clamp((e.clientX-(r.left+r.width/2))/(r.width/2),-1,1);input.jx=x;kn.style.transform=`translateX(${(x*r.width*.3).toFixed(1)}px)`};
  j.addEventListener('pointerdown',e=>{e.preventDefault();id=e.pointerId;j.setPointerCapture&&j.setPointerCapture(id);mv(e)});j.addEventListener('pointermove',e=>{if(e.pointerId===id)mv(e)});
  const end=e=>{if(e.pointerId!==id)return;id=null;input.jx=0;kn.style.transform=''};j.addEventListener('pointerup',end);j.addEventListener('pointercancel',end)}
const KEYS={KeyJ:'L',KeyK:'R',KeyL:'G',Digit1:'L',Digit2:'R',Digit3:'G',Space:'K'};const kx={};
addEventListener('keydown',e=>{if(e.code==='Enter'&&!$('title').hidden){$('go').click();return}if(e.repeat)return;const k=KEYS[e.code];if(k){e.preventDefault();if($('b'+k))$('b'+k).classList.add('tapfx');press(k)}
  if(e.code==='ArrowLeft'||e.code==='KeyA')kx.l=1;if(e.code==='ArrowRight'||e.code==='KeyD')kx.r=1});
addEventListener('keyup',e=>{const k=KEYS[e.code];if(k&&$('b'+k))$('b'+k).classList.remove('tapfx');if(e.code==='ArrowLeft'||e.code==='KeyA')kx.l=0;if(e.code==='ArrowRight'||e.code==='KeyD')kx.r=0});
// ---------- 루프 ----------
function update(dt,rdt){
  if(!G||G.over)return;const P=player,jx=clamp(input.jx+(kx.r||0)-(kx.l||0),-1,1);
  updTweens(dt);
  if(G.swing){const w=G.swing,b=w.b;w.t-=rdt;G.balV+=(G.bal*1.6+jx*3.2)*rdt;G.balV*=Math.pow(.35,rdt);G.bal+=G.balV*rdt;const a=clamp(G.bal,-1,1)*.8;
    P.H.set(b.cx+Math.sin(a),b.lipY-Math.cos(a),b.hangZ);P.lean=-a;P.pitch=0;setOff(P,'lf',-.11-G.balV*.05,-.78,-.04,10);setOff(P,'rf',.11-G.balV*.05,-.78,-.04,10);
    if(Math.abs(G.bal)>=1){fall('배른도어! 손이 터졌다',Math.sign(G.bal)*2)}
    else if(w.t<=0){G.swing=null;showBal(false);say('');pop('버팀!','#46d18c',46);addScore(150);G.secs[G.si].top?topOut():hookGauge()}}
  $('bal').querySelector('.needle').style.left=((clamp(G.bal,-1,1)+1)*50)+'%';$('bal').classList.toggle('bad',Math.abs(G.bal)>.6);
  updQte(rdt);updVillain(dt,rdt);updParts(stopT>0?0:rdt);
  if(G.fall){const f=G.fall;f.t+=rdt;
    if(!f.landed){f.vy-=17*rdt;P.H.y+=f.vy*rdt;P.H.x+=f.vx*rdt;P.H.z+=(1.2-P.H.z)*Math.min(1,rdt*2);P.pitch+=rdt*3.2;P.lean+=rdt*1.5;
      if(P.H.y<=MAT+.22){P.H.y=MAT+.22;f.landed=true;f.t=0;P.pitch=Math.PI/2;P.lean=0;stopT=.08;G.shake=.4;sfx.thud();buzz(40);chalk(P.H,14);pop('철퍼덕!','#fff',52)}}
    else if(f.t>1.2){if(G.lives<=0)gameOver();else{G.fall=null;say('');beginSection(G.cp,true)}}}
  pose(P,G.fall?rdt:dt)}
// 카메라: 달리는 방향 뒤쪽에서 비스듬히. 날아갈 땐 반대편으로 돌면서 줌인
const camT=v3(0,1.4,.6);let camD=1,camO=0,camZ=0,BASE_FOV=56;
function updCam(dt){const sec=G&&G.secs&&G.secs[G.si],d=sec?sec.d:1;camT.lerp(player.H,Math.min(1,dt*5));camD+=(d-camD)*Math.min(1,dt*2.5);
  const ot=G&&G.zoom?1:0;camO+=(ot-camO)*Math.min(1,dt*(ot?2.2:4));const port=camera.aspect<.8,dist=port?5.3:4.2;let sx=0,sy=0;
  if(G&&G.shake>0){G.shake=Math.max(0,G.shake-dt*1.6);sx=(Math.random()-.5)*G.shake*.35;sy=(Math.random()-.5)*G.shake*.35}
  camera.position.set(camT.x-camD*2.3*(1-1.5*camO)+sx,camT.y+.75+sy,dist);camera.lookAt(camT.x+camD*.7*(1-camO),camT.y+.55,.2);
  const zt=G&&G.zoom?1:0;camZ+=(zt-camZ)*Math.min(1,dt*(zt?4:6));const f=BASE_FOV-8*camZ;if(Math.abs(camera.fov-f)>.01){camera.fov=f;camera.updateProjectionMatrix()}}
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;BASE_FOV=w/h<.8?58:48;camera.fov=BASE_FOV;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();
let last=performance.now();function frame(now){let rdt=Math.min(.05,(now-last)/1000);last=now;if(document.hidden||window.__freeze)rdt=0;let dt=rdt;
  if(stopT>0){stopT-=rdt;dt=0}else if(G&&G.qte)dt*=.1;else if(slowT>0){slowT-=rdt;dt*=.35}
  update(dt,rdt);updCam(Math.max(rdt,.016));renderer.render(scene,camera);requestAnimationFrame(frame)}
requestAnimationFrame(frame);
$('go').addEventListener('click',()=>{initAudio();$('title').hidden=true;newGame()});
$('again').addEventListener('click',()=>{$('result').hidden=true;newGame()});
// 시험용 훅
window.__wall={get G(){return G},press,input,P:player,fall:w=>fall(w)};
</script>
